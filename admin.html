<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0b0b0d">
<script>(()=>{let t;try{t=localStorage.getItem('sophon-theme')}catch{}t=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='light'?'#faf8f3':'#0b0b0d'})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản lý bình luận — Sophon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><circle cx=%278%27 cy=%278%27 r=%275%27 fill=%27%23f0b35a%27/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<link rel="stylesheet" href="style.css">
<script defer src="site.js"></script>
</head><body><header class="site-header"><nav aria-label="Điều hướng chính"><a class="brand" href="/vi/">sophon</a><span class="links"><span class="lang-switch" aria-label="Ngôn ngữ"><strong aria-current="true">VI</strong> <span aria-hidden="true">|</span> <a href="/en/" data-lang="en" lang="en">EN</a></span><button class="theme-toggle" type="button" aria-label="Chuyển sang giao diện sáng"><svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A9 9 0 0 1 10.8 3.5a9 9 0 1 0 9.7 9.7Z"/></svg></button></span></nav></header>
<main class="admin-page">
<h1>Quản lý bình luận</h1>
<form class="comment-form" id="login">
  <label>Admin token<input id="token" type="password" required autocomplete="off"></label>
  <label class="comment-remember"><input id="remember" type="checkbox">Ghi nhớ trên trình duyệt này để bình luận với tư cách tác giả</label>
  <button type="submit">Tải bình luận</button>
  <button type="button" id="forget">Quên trên trình duyệt này</button>
</form>
<p class="comment-status" id="status" role="status"></p>
<div id="list"></div>
<script type="module">
const form = document.getElementById('login'), input = document.getElementById('token');
const remember = document.getElementById('remember');
const status = document.getElementById('status'), list = document.getElementById('list');
try { input.value = sessionStorage.getItem('sophon-admin-token') || ''; } catch {}
try {
  const saved = localStorage.getItem('sophon-author');
  input.value ||= saved || ''; remember.checked = !!saved && saved === input.value;
} catch {}
const make = (tag, className, text) => {
  const el = document.createElement(tag); el.className = className; el.textContent = text; return el;
};
let activeToken = '';
async function request(path, method = 'GET') {
  const response = await fetch(path, { method, headers: { Authorization: `Bearer ${activeToken}` }, cache: 'no-store' });
  if (!response.ok) throw new Error(response.status === 401 ? 'Admin token không đúng.' : 'Không thể kết nối. Vui lòng thử lại.');
  return response.json();
}
async function load() {
  const requestedToken = input.value;
  activeToken = requestedToken; status.textContent = 'Đang tải…'; list.replaceChildren();
  try {
    const comments = await request('/api/admin/comments');
    if (activeToken !== requestedToken || input.value !== requestedToken) return;
    try { sessionStorage.setItem('sophon-admin-token', activeToken); } catch {}
    if (remember.checked) { try { localStorage.setItem('sophon-author', activeToken); } catch {} }
    for (const comment of comments) {
      const card = make('article', 'comment', ''), meta = make('div', 'comment-meta', '');
      card.dataset.id = comment.id; card.dataset.parentId = comment.parent_id ?? '';
      if (comment.parent_id != null) card.classList.add('comment-reply');
      const date = new Date(comment.created_at * 1000);
      const time = make('time', '', date.toLocaleString('vi-VN')); time.dateTime = date.toISOString();
      meta.append(make('strong', '', comment.name));
      if (comment.is_author === 1) meta.append(make('span', 'comment-author', '✓ Tác giả'));
      meta.append(make('span', '', `Bài ${comment.episode} · ${comment.lang || '—'}`), time);
      if (comment.parent_id != null) meta.append(make('span', '', `↳ trả lời #${comment.parent_id}`));
      const remove = make('button', '', 'Xoá'); remove.type = 'button';
      remove.addEventListener('click', async () => {
        if (!confirm(comment.parent_id == null ? 'Xoá bình luận này và tất cả câu trả lời?' : 'Xoá bình luận này?')) return;
        remove.disabled = true;
        try {
          await request(`/api/admin/comments/${comment.id}`, 'DELETE');
          for (const item of [...list.children]) {
            if (item.dataset.id === String(comment.id) || item.dataset.parentId === String(comment.id)) item.remove();
          }
          status.textContent = 'Đã xoá bình luận.';
        }
        catch (error) { status.textContent = error.message; remove.disabled = false; }
      });
      card.append(meta, make('p', 'comment-body', comment.body), remove); list.append(card);
    }
    status.textContent = comments.length ? `${comments.length} bình luận mới nhất.` : 'Chưa có bình luận nào.';
  } catch (error) { status.textContent = error.message; }
}
form.addEventListener('submit', event => { event.preventDefault(); load(); });
const forget = () => {
  try { localStorage.removeItem('sophon-author'); } catch {}
  remember.checked = false;
};
remember.addEventListener('change', () => { if (remember.checked) load(); else forget(); });
document.getElementById('forget').addEventListener('click', forget);
if (input.value) load();
</script>
</main></body></html>
